<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bubble Body — Escultura Corporal de Partículas</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ==================== ESCENARIO PRINCIPAL ==================== -->
  <main id="stage">
    <video id="input-video" playsinline autoplay muted></video>
    <canvas id="bg-canvas"></canvas>
    <canvas id="main-canvas"></canvas>
    <canvas id="calib-canvas"></canvas>
  </main>

  <!-- ==================== TELEMETRÍA (HUD) ==================== -->
  <section id="telemetry" aria-label="Telemetría del sistema">
    <div class="telemetry-row">
      <span class="telemetry-label">Estado</span>
      <span id="tm-state" class="telemetry-value state-off">CÁMARA APAGADA</span>
    </div>
    <div class="telemetry-row">
      <span class="telemetry-label">FPS</span>
      <span id="tm-fps" class="telemetry-value">0</span>
    </div>
    <div class="telemetry-row">
      <span class="telemetry-label">Latencia Pose</span>
      <span id="tm-latency" class="telemetry-value">0 ms</span>
    </div>
    <div class="telemetry-row">
      <span class="telemetry-label">Burbujas activas</span>
      <span id="tm-bubbles" class="telemetry-value">0</span>
    </div>
    <div class="telemetry-row">
      <span class="telemetry-label">Landmarks</span>
      <span id="tm-landmarks" class="telemetry-value">0 / 33</span>
    </div>
  </section>

  <!-- ==================== PANEL LATERAL ==================== -->
  <aside id="panel">
    <header class="panel-header">
      <h1>Bubble&nbsp;Body</h1>
      <p class="panel-sub">Escultura corporal de partículas físicas</p>
    </header>

    <section class="panel-group">
      <h2>Cámara &amp; Escena</h2>
      <div class="panel-buttons">
        <button id="btn-camera" class="btn btn-primary">Iniciar cámara</button>
        <button id="btn-regen" class="btn">Regenerar burbujas</button>
      </div>
      <div class="panel-buttons">
        <button id="btn-calibrate" class="btn">Calibrar pared</button>
        <button id="btn-toggle-bg" class="btn">Mostrar/ocultar fondo</button>
      </div>
    </section>

    <section class="panel-group">
      <h2>Población</h2>
      <label class="field">
        <span>Cantidad de burbujas <em id="val-count">1500</em></span>
        <input type="range" id="ctl-count" min="1000" max="2000" step="10" value="1500" />
      </label>
      <label class="field">
        <span>Tamaño <em id="val-size">4.0</em></span>
        <input type="range" id="ctl-size" min="1.5" max="9" step="0.1" value="4.0" />
      </label>
    </section>

    <section class="panel-group">
      <h2>Adhesión al cuerpo</h2>
      <label class="field">
        <span>Fuerza de adhesión <em id="val-adhesion">0.85</em></span>
        <input type="range" id="ctl-adhesion" min="0.1" max="1" step="0.01" value="0.85" />
      </label>
      <label class="field">
        <span>Suavizado (anti-jitter) <em id="val-smooth">0.35</em></span>
        <input type="range" id="ctl-smooth" min="0.05" max="0.95" step="0.01" value="0.35" />
      </label>
      <label class="field">
        <span>Velocidad de llegada <em id="val-arrival">0.30</em></span>
        <input type="range" id="ctl-arrival" min="0.05" max="1" step="0.01" value="0.30" />
      </label>
    </section>

    <section class="panel-group">
      <h2>Física</h2>
      <label class="field">
        <span>Rebote <em id="val-bounce">0.6</em></span>
        <input type="range" id="ctl-bounce" min="0" max="1" step="0.01" value="0.6" />
      </label>
      <label class="field">
        <span>Flotación <em id="val-float">0.55</em></span>
        <input type="range" id="ctl-float" min="0" max="1" step="0.01" value="0.55" />
      </label>
      <label class="field">
        <span>Modo de distribución (sin persona)</span>
        <select id="ctl-distmode">
          <option value="text" selected>Texto "SENATI"</option>
          <option value="wander">Aleatorio (wander)</option>
          <option value="cluster">Agrupado</option>
          <option value="disperse">Disperso</option>
        </select>
      </label>
    </section>

    <section class="panel-group">
      <h2>Apariencia</h2>
      <label class="field">
        <span>Modo de color</span>
        <select id="ctl-colormode">
          <option value="custom">Personalizado</option>
          <option value="azul" selected>Azul</option>
          <option value="verde">Verde</option>
          <option value="rojo">Rojo</option>
          <option value="morado">Morado</option>
          <option value="dorado">Dorado</option>
          <option value="blanco">Blanco</option>
          <option value="multicolor">Multicolor</option>
        </select>
      </label>
      <label class="field" id="field-custom-color">
        <span>Color personalizado</span>
        <input type="color" id="ctl-color" value="#5ad8ff" />
      </label>
      <label class="field-inline">
        <input type="checkbox" id="ctl-skeleton" />
        <span>Mostrar esqueleto</span>
      </label>
      <label class="field-inline">
        <input type="checkbox" id="ctl-mirror" checked />
        <span>Espejar cámara</span>
      </label>
      <label class="field-inline">
        <input type="checkbox" id="ctl-usecalib" />
        <span>Usar calibración</span>
      </label>
    </section>

    <footer class="panel-footer">
      <p id="calib-hint" class="hint">Sin calibración guardada</p>
    </footer>
  </aside>

  <!-- ==================== LIBRERÍAS (CDN, sin bundler) ==================== -->
  <script src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/pose.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js"></script>

  <script src="app.js"></script>
</body>
</html>
